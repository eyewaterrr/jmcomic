# 阅读页站点模板。安装时把 __DOMAIN__、__CERT__、__KEY__ 换成实际值，
# 放到 /etc/nginx/sites-available/jmcomic 并链接到 sites-enabled。
# 假定 Cloudflare 代理开启，并已有 cloudflare-realip.conf（定义 $cf_origin_ok）。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;

    include /etc/nginx/cloudflare-realip.conf;
    if ($cf_origin_ok = 0) { return 403; }

    access_log off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
